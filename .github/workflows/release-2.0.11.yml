name: Release 2.0.11 Beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-2.0.11.yml'
      - 'src/CyberPW.Assistant2/**'
      - 'src/CyberPW.Updater/**'
      - 'VERSION'
      - 'RELEASE_NOTES_2.0.11.md'
      - 'Build-CSharp-2.0.ps1'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath '.\VERSION' -Raw).Trim()
          if ($version -ne '2.0.11-beta') { throw "Unexpected VERSION: $version" }
      - name: Build production Assistant and updater
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-CSharp-2.0.ps1
      - name: Sanitize release output
        shell: powershell
        run: |
          $root = '.\dist-csharp-2.0-beta'
          $required = @("$root\CyberPW Assistant 2 Beta.exe", "$root\CyberPW Updater.exe", "$root\VERSION")
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path)) { throw "Missing release file: $path" } }
          Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Name -match '(?i)comeback' } | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force -Recurse }
          if (@(Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Name -match '(?i)comeback' }).Count) { throw 'Foreign branding remains in release output.' }
      - name: Pack updater-compatible archive
        shell: powershell
        run: Compress-Archive -Path '.\dist-csharp-2.0-beta\*' -DestinationPath '.\CyberPW-Assistant-2.0-Beta-Portable.zip' -Force
      - name: Publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v2.0.11-beta '.\CyberPW-Assistant-2.0-Beta-Portable.zip#CyberPW-Assistant-2.0-Beta-Portable.zip' --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'CyberPW Assistant 2.0.11 Beta - Quiz Update' --notes-file '.\RELEASE_NOTES_2.0.11.md' --prerelease
