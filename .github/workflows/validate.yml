name: Validate portable build

on:
  push:
    branches: [main, "agent/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $failed = @()
          Get-ChildItem -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$issues) | Out-Null
            if (@($issues).Count) { $failed += "$($_.Name): $((@($issues) | ForEach-Object Message) -join ' | ')" }
          }
          if ($failed.Count) { $failed | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Validate embedded quiz databases
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.Web.Extensions
          $serializer = New-Object System.Web.Script.Serialization.JavaScriptSerializer
          $serializer.MaxJsonLength = 10485760
          $source = Get-Content -LiteralPath '.\src\CyberPW.Assistant2\QuizData.cs' -Raw
          $expected = @{ Kh = 79; ChonPon = 200 }
          foreach ($name in $expected.Keys) {
            $pattern = 'const\s+string\s+' + [Regex]::Escape($name) + '\s*=\s*"([^"]+)";'
            $match = [Regex]::Match($source, $pattern)
            if (-not $match.Success) { throw "Quiz payload $name was not found." }
            try { $packed = [Convert]::FromBase64String($match.Groups[1].Value) }
            catch { throw "Quiz payload $name is not valid Base64: $($_.Exception.Message)" }
            $input = New-Object IO.MemoryStream(,$packed)
            $gzip = New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
            $reader = New-Object IO.StreamReader($gzip,[Text.Encoding]::UTF8)
            try { $json = $reader.ReadToEnd() } finally { $reader.Dispose(); $gzip.Dispose(); $input.Dispose() }
            try { $items = $serializer.DeserializeObject($json) }
            catch { throw "Quiz payload $name contains invalid JSON: $($_.Exception.Message)" }
            $count = @($items).Count
            if ($count -ne $expected[$name]) { throw "Quiz payload $name count is $count, expected $($expected[$name])." }
            foreach ($item in @($items)) {
              if ([string]::IsNullOrWhiteSpace([string]$item['question']) -or [string]::IsNullOrWhiteSpace([string]$item['answer'])) {
                throw "Quiz payload $name contains an empty question or answer."
              }
            }
            Write-Host "$name OK: $count records"
          }

      - name: Build C# Assistant and updater
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-CSharp-2.0.ps1

      - name: Verify C# release output
        shell: powershell
        run: |
          $required = @('dist-csharp-2.0-beta\CyberPW Assistant 2 Beta.exe','dist-csharp-2.0-beta\CyberPW Updater.exe','dist-csharp-2.0-beta\VERSION')
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path)) { throw "Missing C# build output: $path" } }
          $version = (Get-Content -LiteralPath 'dist-csharp-2.0-beta\VERSION' -Raw).Trim()
          if ($version -ne '2.0.12-beta') { throw "Unexpected VERSION: $version" }
          $foreign = @(Get-ChildItem -LiteralPath 'dist-csharp-2.0-beta' -Recurse -Force | Where-Object { $_.Name -match '(?i)comeback' })
          foreach ($item in $foreign) { Remove-Item -LiteralPath $item.FullName -Force -Recurse }
          if (@(Get-ChildItem -LiteralPath 'dist-csharp-2.0-beta' -Recurse -Force | Where-Object { $_.Name -match '(?i)comeback' }).Count) { throw 'Foreign branding remains in release output.' }

      - name: Pack C# release candidate
        shell: powershell
        run: Compress-Archive -Path '.\dist-csharp-2.0-beta\*' -DestinationPath '.\CyberPW-Assistant-2.0-Beta-Portable.zip' -Force

      - name: Build portable archive
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-Portable.ps1

      - name: Verify build output
        shell: powershell
        run: |
          $required = @('dist\Cyber.pw-Asistant-Portable.zip','dist\SHA256.txt','dist\Cyber.pw-Asistant\CyberPW-MacroStudio.ps1','dist\Cyber.pw-Asistant\CyberPW-TerritoryMap.ps1','dist\Cyber.pw-Asistant\CyberPW-Design.ps1')
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path)) { throw "Missing build output: $path" } }

      - name: Upload C# release candidate
        uses: actions/upload-artifact@v4
        with:
          name: CyberPW-Assistant-2.0.12-Beta-${{ github.sha }}
          path: CyberPW-Assistant-2.0-Beta-Portable.zip
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPW-Assistant-${{ github.sha }}
          path: |
            dist/Cyber.pw-Asistant-Portable.zip
            dist/SHA256.txt
          if-no-files-found: error
