name: Validate portable build

on:
  push:
    branches: [main, "agent/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $failed = @()
          Get-ChildItem -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$issues) | Out-Null
            if (@($issues).Count) {
              $failed += "$($_.Name): $((@($issues) | ForEach-Object Message) -join ' | ')"
            }
          }
          if ($failed.Count) {
            $failed | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Build C# Assistant and updater
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-CSharp-2.0.ps1

      - name: Verify C# release output
        shell: powershell
        run: |
          $required = @(
            'dist-csharp-2.0-beta\CyberPW Assistant 2 Beta.exe',
            'dist-csharp-2.0-beta\CyberPW Updater.exe',
            'dist-csharp-2.0-beta\VERSION'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing C# build output: $path" }
          }
          $version = (Get-Content -LiteralPath 'dist-csharp-2.0-beta\VERSION' -Raw).Trim()
          if ($version -ne '2.0.11-beta') { throw "Unexpected VERSION: $version" }

      - name: Pack C# release candidate
        shell: powershell
        run: Compress-Archive -Path '.\dist-csharp-2.0-beta\*' -DestinationPath '.\CyberPW-Assistant-2.0-Beta-Portable.zip' -Force

      - name: Build portable archive
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-Portable.ps1

      - name: Verify build output
        shell: powershell
        run: |
          $required = @(
            'dist\Cyber.pw-Asistant-Portable.zip',
            'dist\SHA256.txt',
            'dist\Cyber.pw-Asistant\CyberPW-MacroStudio.ps1',
            'dist\Cyber.pw-Asistant\CyberPW-TerritoryMap.ps1',
            'dist\Cyber.pw-Asistant\CyberPW-Design.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing build output: $path" }
          }

      - name: Upload C# release candidate
        uses: actions/upload-artifact@v4
        with:
          name: CyberPW-Assistant-2.0.11-Beta-${{ github.sha }}
          path: CyberPW-Assistant-2.0-Beta-Portable.zip
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPW-Assistant-${{ github.sha }}
          path: |
            dist/Cyber.pw-Asistant-Portable.zip
            dist/SHA256.txt
          if-no-files-found: error
