name: Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath '.\VERSION' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty.' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid VERSION format: $version" }
          if (-not (Test-Path -LiteralPath '.\RELEASE_NOTES.md' -PathType Leaf)) { throw 'RELEASE_NOTES.md is missing.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Validate embedded quiz databases
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.Web.Extensions
          $serializer = New-Object System.Web.Script.Serialization.JavaScriptSerializer
          $serializer.MaxJsonLength = 10485760
          $source = Get-Content -LiteralPath '.\src\CyberPW.Assistant2\QuizData.cs' -Raw
          $expected = @{ Kh = 79; ChonPon = 200 }
          foreach ($name in $expected.Keys) {
            $pattern = 'const\s+string\s+' + [Regex]::Escape($name) + '\s*=\s*"([^"]+)";'
            $match = [Regex]::Match($source, $pattern)
            if (-not $match.Success) { throw "Quiz payload $name was not found." }
            $packed = [Convert]::FromBase64String($match.Groups[1].Value)
            $input = New-Object IO.MemoryStream(,$packed)
            $gzip = New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
            $reader = New-Object IO.StreamReader($gzip,[Text.Encoding]::UTF8)
            try { $json = $reader.ReadToEnd() } finally { $reader.Dispose(); $gzip.Dispose(); $input.Dispose() }
            $items = $serializer.DeserializeObject($json)
            if (@($items).Count -ne $expected[$name]) { throw "Quiz payload $name has unexpected item count." }
          }

      - name: Verify TitulHelper auto-input guards
        shell: powershell
        run: |
          $source = Get-Content -LiteralPath '.\src\CyberPW.Assistant2\TitleCoordinateService.cs' -Raw
          $required = @('PressEscape(2,130)', 'PressEscape(3,130)', 'EnsureCoordinatePanel', 'CoordSigCount', 'matches>=4', 'changedPoints>=3', 'MacroNative.Text(title.x+" "+title.y)', 'MacroNative.Text(title.name)')
          foreach ($token in $required) { if (-not $source.Contains($token)) { throw "Missing TitulHelper auto-input guard: $token" } }
          if ($source.Contains('SendKeys.SendWait')) { throw 'Legacy SendKeys remains in TitulHelper auto-input.' }

      - name: Build production Assistant and updater
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-CSharp-2.0.ps1

      - name: Verify release output
        shell: powershell
        run: |
          $root = '.\dist-csharp-2.0-beta'
          $required = @("$root\CyberPW Assistant 2 Beta.exe", "$root\CyberPW Updater.exe", "$root\VERSION")
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $path" } }
          $sourceVersion = (Get-Content -LiteralPath '.\VERSION' -Raw).Trim()
          $builtVersion = (Get-Content -LiteralPath "$root\VERSION" -Raw).Trim()
          if ($builtVersion -ne $sourceVersion) { throw "Built VERSION $builtVersion does not match source VERSION $sourceVersion" }
          Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Name -match '(?i)comeback' } | Sort-Object FullName -Descending | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force -Recurse }
          if (@(Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Name -match '(?i)comeback' }).Count) { throw 'Foreign branding remains in release output.' }

      - name: Pack updater-compatible archive
        shell: powershell
        run: |
          $archive = '.\CyberPW-Assistant-2.0-Beta-Portable.zip'
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path '.\dist-csharp-2.0-beta\*' -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Release archive was not created.' }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $asset = '.\CyberPW-Assistant-2.0-Beta-Portable.zip'
          $title = "CyberPW Assistant $env:VERSION"
          $isPrerelease = $env:VERSION.Contains('-')

          gh release view $env:TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $asset --repo '${{ github.repository }}' --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace release asset.' }
            $args = @('release','edit',$env:TAG,'--repo','${{ github.repository }}','--target','${{ github.sha }}','--title',$title,'--notes-file','.\RELEASE_NOTES.md')
            if ($isPrerelease) { $args += '--prerelease' }
            & gh @args
          } else {
            $args = @('release','create',$env:TAG,$asset,'--repo','${{ github.repository }}','--target','${{ github.sha }}','--title',$title,'--notes-file','.\RELEASE_NOTES.md')
            if ($isPrerelease) { $args += '--prerelease' }
            & gh @args
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $json = gh release view $env:TAG --repo '${{ github.repository }}' --json tagName,assets | ConvertFrom-Json
          if ($json.tagName -ne $env:TAG) { throw 'Published tag does not match VERSION.' }
          $asset = @($json.assets | Where-Object { $_.name -eq 'CyberPW-Assistant-2.0-Beta-Portable.zip' })
          if ($asset.Count -ne 1) { throw 'Expected updater-compatible asset was not found.' }
